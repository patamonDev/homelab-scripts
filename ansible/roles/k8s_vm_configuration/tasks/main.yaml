---
- name: Update and upgrade packages
  ansible.builtin.shell: sudo apt update -y && sudo apt upgrade -y
  changed_when: true

- name: Install and configure Kubernetes prerequisites
  ansible.builtin.include_tasks: kube_prereqs.yaml

- name: Download Rust installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/sh.rustup.rs
    mode: '0755'
    force: 'yes'
  
- name: Install Rust
  ansible.builtin.shell: /tmp/sh.rustup.rs -y
  
- name: Install packages necessary for Kubernetes
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ main_packages }}"

- name: Make CNI binary directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    force: true

- name: Download CNI and extract content into the bin directory
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-amd64-v{{ cni_version }}.tgz"
    dest: "/tmp/cni-plugins-linux-amd64-v{{ cni_version }}.tgz"
    mode: '0755'
    force: true

- name: Extract and put content into bin directory
  ansible.builtin.unarchive:
    src: "/tmp/cni-plugins-linux-amd64-v{{ cni_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true

- name: Create containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
  tags:
    - containerd

- name: Create default containerd configuration file
  ansible.builtin.command: containerd config default
  register: containerd_config
  changed_when: false
  tags:
    - containerd

- name: Create containerd config file
  ansible.builtin.file:
    path: /etc/containerd/config.toml
    mode: '0644'
    state: touch
  tags:
    - containerd

- name: Copy containerd_config content into containerd config file
  ansible.builtin.blockinfile:
    path: /etc/containerd/config.toml
    block: |
      "{{ containerd_config.stdout }}"   
    mode: '0644'
  notify: Restart containerd
  tags:
    - containerd

- name: Find and replace SystemCgroup line
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: 'SystemCgroup = false'
    line: SystemCgroup = true
  tags:
    - containerd

- name: Start containerd.service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
  tags:
    - containerd

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags:
    - kubernetes_install

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: '0644'
    force: true
  tags:
    - kubernetes_install

- name: Dearmor and install Kubernetes GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  tags:
    - kubernetes_install

- name: Add Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    filename: kubernetes
    state: present
  tags:
    - kubernetes_install

- name: Install K8's Packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop: "{{ kube_packages }}"
  tags:
    - kubernetes_install

- name: Hold Kubernetes packages to prevent auto-upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kube_packages }}"
  tags:
    - kubernetes_install

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true
  tags:
    - kubernetes_install