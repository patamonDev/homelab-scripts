---
- name: Initialize the Kubernetes cluster
  hosts: control_nodes
  gather_facts: false
  become: true
  vars_files:
    - node_vault.yaml
  roles:
    - k8s_initialization

- name: Join Worker Nodes to Control Plane
  hosts: worker_nodes
  gather_facts: false
  become: true
  vars_files:
    - node_vault.yaml
  tasks:
    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['control_nodes'][0] }}"

    - name: Check if node is joined to cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join worker node(s) to the cluster
      ansible.builtin.command: "{{ join_cmd.stdout }}"
      when: not kubelet_conf.stat.exists